<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="319" viewBox="0 0 1200 319" role="img" aria-label="产品定义、Agent 系统、应用工程，三个模块的动态执行链路。">
<defs>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#25282c" stroke-width=".7"/></pattern>
<style>
text{font-family:Arial,Helvetica,"PingFang SC",sans-serif} .mono{font-family:Menlo,Consolas,monospace}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
.orbit-back{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite reverse}
.bob{animation:bob 4s ease-in-out infinite} .flow{stroke-dasharray:12 22;animation:flow 2s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite} .cursor{animation:cursor 1.2s steps(1) infinite}
.marquee{animation:marquee 18s linear infinite} .travel{animation:travel 5s ease-in-out infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 3s ease-out infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:bar 3.6s ease-in-out infinite}
.sweep{animation:sweep 7s linear infinite} .walk{animation:walk 5s ease-in-out infinite}
.reply{animation:reply 5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes bob{50%{transform:translateY(-18px)}}
@keyframes flow{to{stroke-dashoffset:-68}} @keyframes pulse{50%{opacity:.32}}
@keyframes cursor{50%{opacity:0}} @keyframes marquee{to{transform:translateX(-1140px)}}
@keyframes travel{0%,100%{transform:translateX(0)}50%{transform:translateX(442px)}}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.5);opacity:0}}
@keyframes bar{50%{transform:scaleY(.3)}} @keyframes sweep{from{transform:translateY(-200px)}to{transform:translateY(430px)}}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(74px)}}
@keyframes reply{0%,100%{opacity:.25;transform:translateY(6px)}50%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.orbit,.orbit-back,.bob,.flow,.pulse,.cursor,.marquee,.travel,.ping,.bar,.sweep,.walk,.reply{animation:none}}
</style>
</defs>
<rect width="1200" height="319" rx="12" fill="#0c1423"/>
<text x="28" y="38" class="mono" font-size="17" fill="#a1b3c9">/ UNDER THE SURFACE</text>
<text x="961" y="38" class="mono" font-size="15" fill="#9aeed7">PRODUCT ↔ CODE</text><g transform="translate(28 69)"><rect width="364" height="218" rx="5" fill="#142034" stroke="#30415a"/>
<text x="18" y="29" class="mono" font-size="14" fill="#9aeed7">01 / MODULE</text>
<text x="18" y="83" font-size="43" font-weight="800" letter-spacing="-2" fill="#eef8f7">PRODUCT</text>
<text x="19" y="125" font-size="24" font-weight="700" fill="#9aeed7">产品定义与体验设计</text>
<text x="19" y="159" class="mono" font-size="14" fill="#a1b3c9">场景判断 / 机制设计 / 增长与商业化</text>
<path d="M18 189H343" stroke="#41464a"/><path class="flow" style="animation-delay:-0s" d="M18 189H343" stroke="#9aeed7" stroke-width="3"/></g><g transform="translate(418 69)"><rect width="364" height="218" rx="5" fill="#142034" stroke="#30415a"/>
<text x="18" y="29" class="mono" font-size="14" fill="#b9c9ff">02 / MODULE</text>
<text x="18" y="83" font-size="43" font-weight="800" letter-spacing="-2" fill="#eef8f7">AGENTS</text>
<text x="19" y="125" font-size="24" font-weight="700" fill="#b9c9ff">上下文、记忆与执行</text>
<text x="19" y="159" class="mono" font-size="14" fill="#a1b3c9">CONTEXT / RAG / TOOLS / EVALS</text>
<path d="M18 189H343" stroke="#41464a"/><path class="flow" style="animation-delay:-1s" d="M18 189H343" stroke="#b9c9ff" stroke-width="3"/></g><g transform="translate(808 69)"><rect width="364" height="218" rx="5" fill="#142034" stroke="#30415a"/>
<text x="18" y="29" class="mono" font-size="14" fill="#ffc29a">03 / MODULE</text>
<text x="18" y="83" font-size="43" font-weight="800" letter-spacing="-2" fill="#eef8f7">SYSTEMS</text>
<text x="19" y="125" font-size="24" font-weight="700" fill="#ffc29a">应用架构与实时交互</text>
<text x="19" y="159" class="mono" font-size="14" fill="#a1b3c9">WEB / MOBILE / DESKTOP / UE5</text>
<path d="M18 189H343" stroke="#41464a"/><path class="flow" style="animation-delay:-2s" d="M18 189H343" stroke="#ffc29a" stroke-width="3"/></g></svg>