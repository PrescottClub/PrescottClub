<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="PrescottClub. End of file. 动态反馈回路。">
<defs>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#25282c" stroke-width=".7"/></pattern>
<style>
text{font-family:Arial,Helvetica,"PingFang SC",sans-serif} .mono{font-family:Menlo,Consolas,monospace}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
.orbit-back{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite reverse}
.bob{animation:bob 4s ease-in-out infinite} .flow{stroke-dasharray:12 22;animation:flow 2s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite} .cursor{animation:cursor 1.2s steps(1) infinite}
.marquee{animation:marquee 18s linear infinite} .travel{animation:travel 5s ease-in-out infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 3s ease-out infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:bar 3.6s ease-in-out infinite}
.sweep{animation:sweep 7s linear infinite} .walk{animation:walk 5s ease-in-out infinite}
.reply{animation:reply 5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes bob{50%{transform:translateY(-18px)}}
@keyframes flow{to{stroke-dashoffset:-68}} @keyframes pulse{50%{opacity:.32}}
@keyframes cursor{50%{opacity:0}} @keyframes marquee{to{transform:translateX(-1140px)}}
@keyframes travel{0%,100%{transform:translateX(0)}50%{transform:translateX(442px)}}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.5);opacity:0}}
@keyframes bar{50%{transform:scaleY(.3)}} @keyframes sweep{from{transform:translateY(-200px)}to{transform:translateY(430px)}}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(74px)}}
@keyframes reply{0%,100%{opacity:.25;transform:translateY(6px)}50%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.orbit,.orbit-back,.bob,.flow,.pulse,.cursor,.marquee,.travel,.ping,.bar,.sweep,.walk,.reply{animation:none}}
</style>
</defs>
<rect width="1200" height="140" rx="12" fill="#0c1423"/>
<text x="28" y="46" class="mono" font-size="16" fill="#a1b3c9">/ END OF FILE</text>
<text x="27" y="100" font-size="43" font-weight="800" letter-spacing="-2" fill="#eef8f7">PRESCOTTCLUB</text>
<path d="M652 78H1110" stroke="#3d4440" stroke-width="2"/>
<g transform="translate(655 78)"><g class="travel"><circle r="7" fill="#9aeed7"/><circle r="18" fill="none" stroke="#9aeed7" class="ping"/></g></g>
<path d="M1100 69l13 9l-13 9" fill="none" stroke="#9aeed7" stroke-width="2"/>
<text x="653" y="114" class="mono" font-size="15" fill="#a1b3c9">DESIGN → BUILD → FEEDBACK → REPEAT</text></svg>