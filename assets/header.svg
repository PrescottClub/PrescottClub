<text x="49" y="166" font-size="84" font-weight="900" letter-spacing="-5" fill="#f4f0e7">AI PRODUCT</text>
<text x="49" y="252" font-size="84" font-weight="900" letter-spacing="-5" fill="#f4f0e7">MANAGER</text>
<text x="53" y="318" font-size="42" font-weight="800" letter-spacing="-1.8" fill="#f36b3f">&amp; AI APPLICATION ENGINEER</text>
<path d="M52 350H675" stroke="#52524a"/>
<text x="53" y="392" class="mono" font-size="18" fill="#d2cdc2">PRODUCT THINKING × SYSTEM BUILDING</text>
<text x="53" y="429" class="mono" font-size="15" fill="#9d9b91">IDEA → INTERFACE → AGENT → WORKING APP</text>
<g transform="translate(752 48)">
