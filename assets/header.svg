<rect x="172" y="308" width="170" height="43" rx="4" fill="#f4f0e7"/><text x="189" y="336" fill="#171816">05 / EVAL</text>
</g>
<circle class="pulse" cx="21" cy="330" r="10" fill="#f36b3f"/>
<text x="0" y="395" class="mono" font-size="14" fill="#a29e93">MODEL OUTPUT IS ONLY THE BEGINNING ↗</text>
</g></g></svg>