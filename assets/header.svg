<path d="M21 49H164V116H310V183H84V250H309V330H21" fill="none" stroke="#44443e" stroke-width="20" stroke-linejoin="round"/>
<path class="flow" d="M21 49H164V116H310V183H84V250H309V330H21" fill="none" stroke="#f36b3f" stroke-width="4" stroke-linejoin="round"/>
<g class="mono" font-size="17" font-weight="700">
<rect x="0" y="27" width="132" height="43" rx="4" fill="#f4f0e7"/><text x="15" y="55" fill="#171816">01 / INTENT</text>
<rect x="148" y="94" width="180" height="43" rx="4" fill="#f36b3f"/><text x="165" y="122" fill="#171816">02 / CONTEXT</text>
<rect x="153" y="161" width="203" height="43" rx="4" fill="#f4f0e7"/><text x="170" y="189" fill="#171816">03 / DECISION</text>
