<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="PrescottClub: AI Product Manager and AI Application Engineer">
<defs>
<clipPath id="clip"><rect width="1200" height="460" rx="12"/></clipPath>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#43433d"/></pattern>
<style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.flow{stroke-dasharray:5 12;animation:move 2.8s linear infinite}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes move{to{stroke-dashoffset:-34}}@keyframes pulse{50%{opacity:.2}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="460" fill="#171816"/><rect x="720" width="480" height="460" fill="url(#dots)"/>
<path d="M0 0H1200" stroke="#f36b3f" stroke-width="9"/><path d="M720 0V460" stroke="#474740"/>
