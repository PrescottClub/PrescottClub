<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="PrescottClub. AI 产品经理与 AI 应用开发工程师。动态 Agent 回路：上下文、记忆、工具与行动。">
<defs>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#25282c" stroke-width=".7"/></pattern>
<style>
text{font-family:Arial,Helvetica,"PingFang SC",sans-serif} .mono{font-family:Menlo,Consolas,monospace}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}
.orbit-back{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite reverse}
.bob{animation:bob 4s ease-in-out infinite} .flow{stroke-dasharray:12 22;animation:flow 2s linear infinite}
.pulse{animation:pulse 3s ease-in-out infinite} .cursor{animation:cursor 1.2s steps(1) infinite}
.marquee{animation:marquee 18s linear infinite} .travel{animation:travel 5s ease-in-out infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 3s ease-out infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:bar 3.6s ease-in-out infinite}
.sweep{animation:sweep 7s linear infinite} .walk{animation:walk 5s ease-in-out infinite}
.reply{animation:reply 5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes bob{50%{transform:translateY(-18px)}}
@keyframes flow{to{stroke-dashoffset:-68}} @keyframes pulse{50%{opacity:.32}}
@keyframes cursor{50%{opacity:0}} @keyframes marquee{to{transform:translateX(-1140px)}}
@keyframes travel{0%,100%{transform:translateX(0)}50%{transform:translateX(442px)}}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.5);opacity:0}}
@keyframes bar{50%{transform:scaleY(.3)}} @keyframes sweep{from{transform:translateY(-200px)}to{transform:translateY(430px)}}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(74px)}}
@keyframes reply{0%,100%{opacity:.25;transform:translateY(6px)}50%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.orbit,.orbit-back,.bob,.flow,.pulse,.cursor,.marquee,.travel,.ping,.bar,.sweep,.walk,.reply{animation:none}}
</style>
</defs>
<rect width="1200" height="700" rx="16" fill="#101216"/>
<rect x="620" y="76" width="552" height="490" fill="url(#grid)"/>
<path d="M30 70H1170M30 581H1170" stroke="#393d40"/>
<text x="32" y="43" class="mono" font-size="18" fill="#f3f3ea">PRESCOTTCLUB / EXPERIMENTS IN MOTION</text>
<circle cx="1083" cy="36" r="5" fill="#cbff57" class="pulse"/>
<text x="1101" y="43" class="mono" font-size="16" fill="#cbff57">LOOP</text>
<text x="32" y="125" class="mono" font-size="16" letter-spacing="2" fill="#929797">PRODUCT DESIGN × APPLICATION ENGINEERING</text>
<text x="25" y="253" font-size="112" font-weight="900" letter-spacing="-7" fill="#f3f3ea">PRESCOTT</text>
<text x="25" y="370" font-size="138" font-weight="900" letter-spacing="-7" fill="none" stroke="#cbff57" stroke-width="2">CLUB</text>
<rect x="419" y="352" width="55" height="12" fill="#ff795b" class="cursor"/>
<text x="34" y="441" font-size="27" font-weight="700" fill="#f3f3ea">AI 产品经理 &amp; AI 应用开发工程师</text>
<text x="35" y="481" class="mono" font-size="17" fill="#929797">AGENTS / INTERACTION / REALTIME SYSTEMS</text>
<g transform="translate(34 520)"><rect width="166" height="30" rx="15" fill="#cbff57"/><text x="16" y="21" class="mono" font-size="14" fill="#101216">PRODUCT 0 → 1</text>
<text x="185" y="21" class="mono" font-size="15" fill="#f3f3ea">CONTEXT → MEMORY → ACTION</text></g>
<g transform="translate(873 307)">
<circle r="156" fill="none" stroke="#34393a"/>
<circle r="112" fill="none" stroke="#34393a" stroke-dasharray="3 9"/>
<g class="orbit"><circle r="156" fill="none" stroke="#cbff57" stroke-width="2" stroke-dasharray="120 860"/><circle cx="156" r="10" fill="#cbff57"/><circle cx="-156" r="5" fill="#b9acff"/></g>
<g class="orbit-back"><circle r="112" fill="none" stroke="#ff795b" stroke-width="2" stroke-dasharray="70 634"/><circle cy="112" r="7" fill="#ff795b"/><circle cy="-112" r="4" fill="#f3f3ea"/></g>
<g class="bob">
<path d="M0 -66L73 -24V60L0 102L-73 60V-24Z" fill="#1b2418" stroke="#cbff57" stroke-width="2"/>
<path d="M-73 -24L0 18L73 -24M0 18V102M0 -66V18" fill="none" stroke="#cbff57" stroke-width="2"/>
<path d="M0 -66L73 -24L0 18L-73 -24Z" fill="#cbff57" fill-opacity=".15"/>
<circle cx="-32" cy="-12" r="5" fill="#f3f3ea"/><circle cx="32" cy="-12" r="5" fill="#f3f3ea"/>
<text x="-39" y="51" class="mono" font-size="16" fill="#cbff57">AGENT</text>
</g>
</g>
<path class="flow" d="M688 182V307H717M1029 307H1114V407" fill="none" stroke="#b9acff" stroke-width="2"/>
<g transform="translate(642 139)"><rect width="172" height="43" rx="3" fill="#b9acff"/><text x="16" y="28" class="mono" font-size="18" fill="#101216">01 CONTEXT</text></g>
<g transform="translate(967 170)"><rect width="185" height="43" rx="3" fill="#101216" stroke="#cbff57"/><text x="15" y="28" class="mono" font-size="18" fill="#cbff57">02 MEMORY</text></g>
<g transform="translate(645 451)"><rect width="166" height="43" rx="3" fill="#101216" stroke="#ff795b"/><text x="15" y="28" class="mono" font-size="18" fill="#ff795b">03 TOOLS</text></g>
<g transform="translate(987 407)"><rect width="166" height="43" rx="3" fill="#cbff57"/><text x="15" y="28" class="mono" font-size="18" fill="#101216">04 ACTION</text></g>
<text x="842" y="532" class="mono" font-size="14" fill="#929797">↳ feedback loop</text>
<clipPath id="ticker"><rect x="0" y="596" width="1200" height="47"/></clipPath>
<g clip-path="url(#ticker)"><g class="marquee">
<text x="0" y="628" class="mono" font-size="20" textLength="1140" lengthAdjust="spacing" fill="#cbff57">PRODUCT DESIGN / AGENT SYSTEMS / INTERACTIVE WORLDS / CODE /</text>
<text x="1140" y="628" class="mono" font-size="20" textLength="1140" lengthAdjust="spacing" fill="#cbff57">PRODUCT DESIGN / AGENT SYSTEMS / INTERACTIVE WORLDS / CODE /</text>
</g></g>
<path d="M30 656H1170" stroke="#393d40"/>
<text x="32" y="684" class="mono" font-size="14" fill="#929797">SCROLL TO EXPLORE ↓</text>
<text x="886" y="684" class="mono" font-size="14" fill="#929797">DESIGN / BUILD / REPEAT</text>
</svg>